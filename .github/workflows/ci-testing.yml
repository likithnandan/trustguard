name: TrustGuard-IoMT Continuous Integration & Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend API & AI Continuous Trust Verification Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx -r requirements.txt

    - name: Run Backend Pytest Suite
      run: |
        pytest -vv --tb=short

  frontend-test:
    name: Frontend React & Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Frontend Dependencies
      working-directory: ./frontend-react
      run: |
        npm install --legacy-peer-deps

    - name: Run Frontend Vitest Suite
      working-directory: ./frontend-react
      run: |
        npx vitest run --passWithNoTests
