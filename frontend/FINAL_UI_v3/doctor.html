<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Monitor — Doctor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ overflow-x:hidden; }
  .dp-app{ display:flex; min-height:100vh; }

  /* Simplified sidebar - patient list only, no admin nav */
  .dp-sidebar{
    width:300px; background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .dp-brand{ display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid var(--border); }
  .dp-brand-icon{ width:34px; height:34px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-radius:9px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 16px rgba(62,201,255,0.35); flex-shrink:0; }
  .dp-brand-icon svg{ width:18px; height:18px; stroke:#04131c; }
  .dp-brand-name{ font-family:var(--font-display); font-size:14.5px; font-weight:700; color:#fff; }
  .dp-brand-tag{ font-size:10px; color:var(--muted); }

  .dp-search{ padding:14px 16px 8px; }
  .dp-search input{
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; color:var(--text); font-family:'Inter',sans-serif; font-size:12.5px; outline:none;
  }
  .dp-search input:focus{ border-color:var(--accent); }

  .dp-patient-list{ flex:1; overflow-y:auto; padding:6px 10px; }
  .dp-patient-item{
    display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:10px; cursor:pointer;
    margin-bottom:3px; transition:background .15s;
  }
  .dp-patient-item:hover{ background:rgba(255,255,255,0.04); }
  .dp-patient-item.active{ background:var(--accent-soft); }
  .dp-patient-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--accent);
    flex-shrink:0; position:relative;
  }
  .dp-status-dot{
    position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%; border:2px solid var(--sidebar);
  }
  .dp-patient-name{ font-size:12.8px; font-weight:600; color:#fff; }
  .dp-patient-meta{ font-size:10.8px; color:var(--muted); font-family:var(--font-mono); }

  .dp-sidebar-footer{ padding:14px 16px; border-top:1px solid var(--border); }

  /* Main content */
  .dp-main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .dp-topbar{
    background:var(--bg-topbar); border-bottom:1px solid var(--border); padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .dp-topbar h1{ font-family:var(--font-display); font-size:19px; font-weight:600; color:#fff; }
  .dp-topbar p{ font-size:12px; color:var(--muted); margin-top:2px; }
  .dp-content{ padding:24px 28px; flex:1; }

  /* Verification banner */
  .verify-banner{
    display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:14px; margin-bottom:20px;
    border:1px solid;
  }
  .verify-banner.good{ background:var(--green-bg); border-color:rgba(45,212,160,0.35); }
  .verify-banner.warn{ background:var(--amber-bg); border-color:rgba(255,176,32,0.35); }
  .verify-banner.bad{ background:var(--red-bg); border-color:rgba(255,77,106,0.4); }
  .verify-icon{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:20px; }
  .verify-banner.good .verify-icon{ background:rgba(45,212,160,0.2); color:var(--green); }
  .verify-banner.warn .verify-icon{ background:rgba(255,176,32,0.2); color:var(--amber); }
  .verify-banner.bad .verify-icon{ background:rgba(255,77,106,0.2); color:var(--red); }
  .verify-title{ font-family:var(--font-display); font-weight:700; font-size:15px; color:#fff; }
  .verify-sub{ font-size:12.3px; color:var(--muted); margin-top:2px; }

  /* Patient header card */
  .patient-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .patient-header-left{ display:flex; align-items:center; gap:16px; }
  .patient-avatar-lg{
    width:56px; height:56px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:var(--accent);
  }
  .patient-title{ font-family:var(--font-display); font-size:19px; font-weight:700; color:#fff; }
  .patient-sub{ font-size:12.5px; color:var(--muted); margin-top:3px; font-family:var(--font-mono); }
  .patient-trust-score{ text-align:right; }
  .patient-trust-value{ font-family:var(--font-mono); font-size:28px; font-weight:700; }
  .patient-trust-label{ font-size:11px; color:var(--muted); }

  /* Vitals grid */
  .vitals-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:20px; }
  .vital-card{ position:relative; }
  .vital-name{ font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }
  .vital-value{ font-family:var(--font-mono); font-size:30px; font-weight:700; color:#fff; margin-top:8px; }
  .vital-unit{ font-size:13px; color:var(--muted); font-weight:500; margin-left:4px; }
  .vital-badge{ position:absolute; top:16px; right:16px; font-size:14px; }
  .vital-range{ font-size:11px; color:var(--muted); margin-top:6px; }

  .ecg-card canvas, .ecg-card svg{ width:100%; height:70px; margin-top:8px; }

  /* Trust breakdown for doctor - simplified language */
  .why-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:12.8px; }
  .why-row:last-child{ border-bottom:none; }
  .why-label{ color:var(--text); font-weight:600; }
  .why-tag{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
</style>
</head>
<body>
<script>
  if (!localStorage.getItem('authToken')) { window.location.href = 'login.html'; }
</script>

<div class="dp-app">
  <!-- SIDEBAR: PATIENT LIST -->
  <aside class="dp-sidebar">
    <div class="dp-brand">
      <div class="dp-brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg></div>
      <div>
        <div class="dp-brand-name">Patient Monitor</div>
        <div class="dp-brand-tag">Doctor Portal</div>
      </div>
    </div>
    <div class="dp-search"><input type="text" id="patientSearch" placeholder="Search patients..."></div>
    <div class="dp-patient-list" id="patientList"></div>
    <div class="dp-sidebar-footer">
      <div class="side-user" id="sideUserTrigger" style="cursor:pointer; border-top:none; margin-top:0; padding:8px;">
        <div class="avatar" id="sidebarAvatar">DR</div>
        <div>
          <div class="side-user-name" id="sidebarUserName" style="font-size:12.5px;">Doctor</div>
          <div class="side-user-role"><span class="dot"></span> <span id="sidebarUserRole">Doctor</span></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="dp-main">
    <div class="dp-topbar">
      <div>
        <h1>Patient Monitor</h1>
        <p>Verified vitals for the selected patient, reaching you directly from the device</p>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="backToAdminBtn" title="Switch to Admin Dashboard" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
        </button>
        <button class="icon-btn" id="signOutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>

    <div class="dp-content" id="patientDetail"></div>
  </div>
</div>

<!-- Reuse the same profile modal styling/behavior as the admin dashboard -->
<div class="modal-backdrop" id="profileModal">
  <div class="modal-card">
    <div class="modal-top"><button class="modal-close" id="modalClose">✕</button></div>
    <div class="modal-avatar" id="modalAvatar">DR</div>
    <div class="modal-body">
      <div class="modal-name" id="modalUserName">Doctor</div>
      <div class="modal-role" id="modalUserRole">Doctor</div>
      <div class="modal-status"><span class="dot"></span> Online</div>
      <div class="modal-fields">
        <div class="modal-field"><span>Email</span><span id="modalUserEmail">doctor@hospital.org</span></div>
        <div class="modal-field"><span>Last Login</span><span id="modalLastLogin">Just now</span></div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn danger" style="flex:1;" id="modalSignOut">Sign Out</button>
      </div>
    </div>
  </div>
</div>

<script src="doctor.js"></script>
</body>
</html>
